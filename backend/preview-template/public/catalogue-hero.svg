<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="suite" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#1a2428"/>
      <stop offset="55%" stop-color="#10171b"/>
      <stop offset="100%" stop-color="#070a0c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="62%" cy="8%" r="48%">
      <stop offset="0%" stop-color="#e8f4f1" stop-opacity="0.72"/>
      <stop offset="35%" stop-color="#8fbfb6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8fbfb6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c383d"/>
      <stop offset="100%" stop-color="#161d21"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1920" height="1200" fill="url(#suite)"/>
  <rect width="1920" height="1200" fill="url(#lamp)"/>
  <!-- Overhead treatment light slit -->
  <rect x="1188" y="0" width="6" height="420" fill="#e8f4f1" opacity="0.55"/>
  <rect x="1170" y="0" width="42" height="380" fill="#e8f4f1" opacity="0.08" filter="url(#soft)"/>
  <!-- Daylight wash -->
  <ellipse cx="1320" cy="180" rx="520" ry="300" fill="#c5ddd7" opacity="0.14" filter="url(#soft)"/>
  <!-- Treatment bench -->
  <rect x="140" y="680" width="1040" height="220" rx="8" fill="url(#bench)" opacity="0.92"/>
  <rect x="180" y="640" width="160" height="56" rx="6" fill="#3a484e" opacity="0.75"/>
  <!-- Side cabinet / instrument wall -->
  <rect x="1320" y="520" width="460" height="420" rx="10" fill="#12191d" opacity="0.88"/>
  <rect x="1360" y="560" width="380" height="8" fill="#2a635f" opacity="0.35"/>
  <rect x="1360" y="600" width="280" height="4" fill="#e8f4f1" opacity="0.12"/>
  <rect x="1360" y="640" width="320" height="4" fill="#e8f4f1" opacity="0.08"/>
  <!-- Soft speculars -->
  <circle cx="380" cy="360" r="3" fill="#e8f4f1" opacity="0.35"/>
  <circle cx="420" cy="348" r="2" fill="#e8f4f1" opacity="0.22"/>
</svg>
