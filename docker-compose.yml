# Local full stack: API (OpenRouter) + Vite frontend
# Usage:
#   cp backend/.env.example backend/.env   # once, then edit secrets
#   docker compose up --build
# Frontend: http://localhost:5173
# API:      http://localhost:8001
#
# Env layout:
#   backend/.env  — API + app config (Compose env_file)
#   frontend/.env — Vite-only (VITE_*)
# Restart api after backend/.env changes.

name: bmv-local

services:
  db:
    image: postgres:16-alpine
    container_name: bmv-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildmyversion}
      POSTGRES_USER: ${POSTGRES_USER:-bmv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmv-local-password}
    ports:
      - "5432:5432"
    volumes:
      - bmv-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bmv} -d ${POSTGRES_DB:-buildmyversion}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bmv-api
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      # Docker-only overrides (paths / DB / internal networking).
      # All app config (models, AppSpec, preview flags, keys) comes from backend/.env.
      INTERNAL_BASE_URL: http://127.0.0.1:8000
      UPLOAD_DIR: /app/data/uploads
      PREVIEW_APPS_DIR: /app/data/preview-apps
      PREVIEW_TEMPLATE_DIR: /app/backend/preview-template
      DATABASE_URL: postgresql://${POSTGRES_USER:-bmv}:${POSTGRES_PASSWORD:-bmv-local-password}@db:5432/${POSTGRES_DB:-buildmyversion}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - bmv-api-data:/app/data
      - ./backend:/app/backend
      - ./.cursor:/Users/maurice/Documents/Dev/BMV/.cursor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: node:20-alpine
    container_name: bmv-web
    working_dir: /app
    command: >-
      sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi
      && exec npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    environment:
      # Reliable file watching through Docker bind mounts (macOS/Windows)
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - bmv-web-node-modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  bmv-api-data:
  bmv-pg-data:
  bmv-web-node-modules:
