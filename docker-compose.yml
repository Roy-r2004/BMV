# Local full stack: API (OpenRouter) + Vite frontend
# Usage:
#   docker compose up --build
# Frontend: http://localhost:5173
# API:      http://localhost:8001

name: bmv-local

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bmv-api
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      # Always OpenRouter for local compose — never Ollama / local LLM
      AI_PROVIDER: openrouter
      # Fast models (DeepSeek parallel hangs for 20+ min with no file completing)
      TEXT_MODEL: google/gemini-2.5-flash
      PREVIEW_APP_MODEL: google/gemini-2.5-flash
      ARCHITECT_MODEL: google/gemini-2.5-flash
      CRITIC_MODEL: google/gemini-2.5-flash
      FIX_MODEL: google/gemini-2.5-flash
      # Browser hits host-mapped port; Playwright inside container uses 8000
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      INTERNAL_BASE_URL: http://127.0.0.1:8000
      UPLOAD_DIR: /app/data/uploads
      PREVIEW_APPS_DIR: /app/data/preview-apps
      PREVIEW_TEMPLATE_DIR: /app/backend/preview-template
      DATABASE_URL: sqlite:////app/data/buildmyversion.db
      # Parallel is safe after progress_lock/SQLite fixes; 3 keeps Flash responsive
      PREVIEW_PARALLEL_WORKERS: ${PREVIEW_PARALLEL_WORKERS:-3}
      PREVIEW_SKIP_CRITIC: ${PREVIEW_SKIP_CRITIC:-true}
      PREVIEW_SKIP_VISUAL_CRITIC: ${PREVIEW_SKIP_VISUAL_CRITIC:-false}
      PREVIEW_MAX_BUILD_FIX_ATTEMPTS: ${PREVIEW_MAX_BUILD_FIX_ATTEMPTS:-3}
      PREVIEW_MAX_FIX_LOOP_SECONDS: ${PREVIEW_MAX_FIX_LOOP_SECONDS:-300}
    volumes:
      - bmv-api-data:/app/data
      # Live-edit backend without rebuild (optional; comment out for pure image test)
      - ./backend/app:/app/backend/app
      - ./backend/data:/app/backend/data
      - ./backend/preview-template:/app/backend/preview-template
    restart: unless-stopped

  web:
    image: node:20-alpine
    container_name: bmv-web
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8001
    volumes:
      - ./frontend:/app
      - bmv-web-node-modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  bmv-api-data:
  bmv-web-node-modules:
