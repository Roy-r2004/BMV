# Coolify / two-service deploy, ONE Application, ONE env panel:
#   `app`        — main backend + its frontend (buildmyversion.com)
#   `consultant` — the image-demo pipeline (consultant-service)
# Both build and redeploy together on every push to main; every value below
# either has a safe default or is read once from Coolify's shared env panel
# — nothing is entered twice. Ensure a persistent volume is mounted at
# /app/data for `app` and at /app/data for `consultant` (separate volumes,
# same mount path inside each container — Coolify keeps per-service storage).
#
# The ONE genuinely new thing Coolify needs for this deploy: assign a domain
# to the `consultant` service in its dashboard (its routes collide with
# `app`'s, so it can't share buildmyversion.com — see Dockerfile.consultant).
# Once that's set, put the same URL in CONSULTANT_PUBLIC_URL below and every
# other wire-up (CORS, the frontend's build-time API base) follows from it
# automatically — no other manual step, then or on any future deploy.
#
# Pushing main auto-deploys when Coolify is connected to this repository.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        # Same-origin API behind Coolify reverse proxy
        VITE_API_BASE_URL: ""
        VITE_ROY_WHATSAPP_NUMBER: ${ROY_WHATSAPP_NUMBER:-}
        # Derived from CONSULTANT_PUBLIC_URL (the one value this stack asks
        # you to set) — never entered separately.
        VITE_CONSULTANT_API_BASE_URL: ${CONSULTANT_PUBLIC_URL:?Set CONSULTANT_PUBLIC_URL to the domain you assign the consultant service in Coolify, e.g. https://consultant-api.buildmyversion.com}
        # Immutable release metadata supplied by the deployment system.
        APP_GIT_REVISION: ${APP_GIT_REVISION:-}
        APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:-}
        GENERATED_DATA_API_POLICY_REVISION: 2026-07-27.generated-data-api.2
    restart: unless-stopped
    # Coolify injects UI env vars; this additionally forwards a .env file when
    # one is present (compose-file deploys). `environment:` keeps precedence.
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      SEED_DEMO: "false"
      DATABASE_URL: sqlite:////app/data/buildmyversion.db
      UPLOAD_DIR: /app/data/uploads
      STATIC_DIR: /app/static
      PREVIEW_TEMPLATE_DIR: /app/backend/preview-template
      PREVIEW_APPS_DIR: /app/data/preview-apps
      PREVIEW_CANDIDATES_DIR: /app/data/preview-candidates
      PREVIEW_VALIDATIONS_DIR: /app/data/runtime-validation
      DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-roy.rizkallah@hotmail.com}
      ADMIN_NAME: ${ADMIN_NAME:-Roy}
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-}
      ADMIN_SYNC_PASSWORD: ${ADMIN_SYNC_PASSWORD:-true}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      TEXT_MODEL: ${TEXT_MODEL:-google/gemini-2.5-flash}
      PREVIEW_APP_MODEL: ${PREVIEW_APP_MODEL:-google/gemini-2.5-flash}
      ARCHITECT_MODEL: ${ARCHITECT_MODEL:-google/gemini-2.5-flash}
      CRITIC_MODEL: ${CRITIC_MODEL:-google/gemini-2.5-flash}
      FIX_MODEL: ${FIX_MODEL:-google/gemini-2.5-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://buildmyversion.com}
      INTERNAL_BASE_URL: http://127.0.0.1:8000
      APPSPEC_MODE: ${APPSPEC_MODE:-on}
      APPSPEC_MODEL: ${APPSPEC_MODEL:-google/gemini-2.5-flash}
      APPSPEC_REPAIR_MODEL: ${APPSPEC_REPAIR_MODEL:-google/gemini-2.5-flash}
      APPSPEC_COVERAGE_MODEL: ${APPSPEC_COVERAGE_MODEL:-deepseek/deepseek-chat}
      APPSPEC_V2_COVERAGE_MODEL: ${APPSPEC_V2_COVERAGE_MODEL:-deepseek/deepseek-chat}
      APPSPEC_FALLBACK_ENABLED: ${APPSPEC_FALLBACK_ENABLED:-false}
      PORT: "8000"
      # Rollout control plane — fail closed for public traffic
      V2_PHASE7_ROLLOUT_ENABLED: ${V2_PHASE7_ROLLOUT_ENABLED:-true}
      V2_PHASE7_OPS_DASHBOARD_ENABLED: ${V2_PHASE7_OPS_DASHBOARD_ENABLED:-true}
      V2_PHASE7_OPS_ALERTS_ENABLED: ${V2_PHASE7_OPS_ALERTS_ENABLED:-true}
      V2_PHASE7_SHADOW_ENABLED: "false"
      V2_PHASE7_PROMOTE_ENABLED: "false"
      V2_PHASE7_ROLLOUT_PERCENT: "0"
      V2_PHASE7_PERCENT_SERVE_ENABLED: "false"
      V2_PHASE7_LIVE_CANARY_ENABLED: "false"
      V2_PHASE7_LIVE_CANARY_PROVIDERS_ENABLED: "false"
      V2_PHASE7_AUTO_ROLLBACK_ENABLED: "false"
      V2_PHASE7_SHADOW_LIVE_PROVIDERS_ENABLED: "false"
      V2_PHASE7_CANARY_SIMULATION_ENABLED: "false"
      V2_PHASE7_CIRCUIT_BREAKER_ENABLED: "false"
      V2_PHASE7_ALLOW_ADMIN_DUAL_ROLE: "false"
      V2_PHASE7_ROLLOUT_SALT: ${V2_PHASE7_ROLLOUT_SALT:-2026-07-25.1}
    volumes:
      - bmv-persistent-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')",
        ]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s

  consultant:
    build:
      context: .
      dockerfile: Dockerfile.consultant
    restart: unless-stopped
    # Deliberately no env_file here (unlike `app`) — this service needs
    # exactly the two variables below, not the main app's full secret set
    # (admin password, WhatsApp number, etc.) sitting in its container env.
    environment:
      # Same key already set for `app` above — one OpenRouter budget, one
      # place spend is tracked, never entered twice.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Defaults to the SAME public domain already used for CORS_ORIGINS on
      # `app` above, since that's this business's one real frontend origin.
      FRONTEND_ORIGIN: ${CORS_ORIGINS:-https://buildmyversion.com}
      # DATABASE_URL / PORT / UPLOADS_DIR: baked into Dockerfile.consultant
      # already (sqlite:////app/data/consultant.db, 8002, symlinked to
      # /app/data/uploads) — nothing to set here.
      #
      # Every other consultant-service setting (IMAGE_MODEL,
      # DASHBOARD_CANDIDATES, QA_MIN_SCORE, WATERMARK_STYLE, IMAGE_REGISTER,
      # the ENABLE_* feature flags, ...) has a deliberately measured default
      # in app/config.py — verified 2026-08-14 against this exact env, so
      # deliberately left unset rather than restated and risking drift.
    volumes:
      - bmv-consultant-data:/app/data
    ports:
      - "8002:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  bmv-persistent-data:
    name: bmv-persistent-data
  bmv-consultant-data:
    name: bmv-consultant-data
