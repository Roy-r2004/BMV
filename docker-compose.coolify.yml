# Coolify / one-service deploy: keeps SQLite + preview builds across redeploys.
# In Coolify: use this compose file (or Dockerfile.app) and ensure a persistent
# volume is mounted at /app/data. SEED_DEMO stays false — no PlateSync reseed.
#
# Coolify environment (set explicitly in the Coolify UI / env file):
#   V2_CANDIDATE_COMPONENT_MODEL=google/gemini-2.5-flash
#   V2_CANDIDATE_PAGE_MODEL=google/gemini-2.5-flash
#   Do NOT leave either unset to inherit PREVIEW_APP_MODEL
#   (deepseek/deepseek-chat is 32k and fails preflight on large prompts).
#   Coolify may retain stale env overrides — set both explicitly.
#
# Coolify UI alternative (Dockerfile deploy):
#   Storages → Add → Destination Path = /app/data
#
# Pushing main auto-deploys when Coolify is connected to this repository.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        # Same-origin API behind Coolify reverse proxy
        VITE_API_BASE_URL: ""
        VITE_ROY_WHATSAPP_NUMBER: ${ROY_WHATSAPP_NUMBER:-}
        # Immutable release metadata supplied by the deployment system.
        APP_GIT_REVISION: ${APP_GIT_REVISION:-}
        APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:-}
        GENERATED_DATA_API_POLICY_REVISION: 2026-07-27.generated-data-api.1
    restart: unless-stopped
    environment:
      APP_ENV: production
      SEED_DEMO: "false"
      DATABASE_URL: sqlite:////app/data/buildmyversion.db
      UPLOAD_DIR: /app/data/uploads
      STATIC_DIR: /app/static
      PREVIEW_TEMPLATE_DIR: /app/backend/preview-template
      PREVIEW_APPS_DIR: /app/data/preview-apps
      PREVIEW_CANDIDATES_DIR: /app/data/preview-candidates
      PREVIEW_VALIDATIONS_DIR: /app/data/runtime-validation
      DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-roy.rizkallah@hotmail.com}
      ADMIN_NAME: ${ADMIN_NAME:-Roy}
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-}
      ADMIN_SYNC_PASSWORD: ${ADMIN_SYNC_PASSWORD:-true}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      TEXT_MODEL: ${TEXT_MODEL:-google/gemini-2.5-flash}
      PREVIEW_APP_MODEL: ${PREVIEW_APP_MODEL:-deepseek/deepseek-chat}
      # Candidate stages: explicit large-context models (do not inherit PREVIEW_APP_MODEL).
      V2_CANDIDATE_COMPONENT_MODEL: ${V2_CANDIDATE_COMPONENT_MODEL:-google/gemini-2.5-flash}
      V2_CANDIDATE_PAGE_MODEL: ${V2_CANDIDATE_PAGE_MODEL:-google/gemini-2.5-flash}
      ARCHITECT_MODEL: ${ARCHITECT_MODEL:-google/gemini-2.5-flash}
      CRITIC_MODEL: ${CRITIC_MODEL:-google/gemini-2.5-flash}
      FIX_MODEL: ${FIX_MODEL:-google/gemini-2.5-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://buildmyversion.com}
      INTERNAL_BASE_URL: http://127.0.0.1:8000
      APPSPEC_MODE: ${APPSPEC_MODE:-on}
      APPSPEC_MODEL: ${APPSPEC_MODEL:-google/gemini-2.5-flash}
      APPSPEC_REPAIR_MODEL: ${APPSPEC_REPAIR_MODEL:-google/gemini-2.5-flash}
      APPSPEC_COVERAGE_MODEL: ${APPSPEC_COVERAGE_MODEL:-deepseek/deepseek-chat}
      APPSPEC_V2_COVERAGE_MODEL: ${APPSPEC_V2_COVERAGE_MODEL:-deepseek/deepseek-chat}
      APPSPEC_FALLBACK_ENABLED: ${APPSPEC_FALLBACK_ENABLED:-false}
      PORT: "8000"
      # Preview Generator v2 — public defaults
      PREVIEW_GENERATOR_V2: "true"
      V2_RUNTIME_VALIDATION_ENABLED: "true"
      V2_VISUAL_EVALUATION_ENABLED: "true"
      # Tier 2 capability only (admin-approved Expanded Preview start); never auto-run
      V2_TIER2_GENERATION_ENABLED: "true"
      V2_TIER3_GENERATION_ENABLED: "false"
      # Phase 7 hard gates — fail closed for public traffic
      V2_PHASE7_ROLLOUT_ENABLED: ${V2_PHASE7_ROLLOUT_ENABLED:-true}
      V2_PHASE7_OPS_DASHBOARD_ENABLED: ${V2_PHASE7_OPS_DASHBOARD_ENABLED:-true}
      V2_PHASE7_OPS_ALERTS_ENABLED: ${V2_PHASE7_OPS_ALERTS_ENABLED:-true}
      V2_PHASE7_SHADOW_ENABLED: "false"
      V2_PHASE7_PROMOTE_ENABLED: "false"
      V2_PHASE7_ROLLOUT_PERCENT: "0"
      V2_PHASE7_PERCENT_SERVE_ENABLED: "false"
      V2_PHASE7_LIVE_CANARY_ENABLED: "false"
      V2_PHASE7_LIVE_CANARY_PROVIDERS_ENABLED: "false"
      V2_PHASE7_AUTO_ROLLBACK_ENABLED: "false"
      V2_PHASE7_SHADOW_LIVE_PROVIDERS_ENABLED: "false"
      V2_PHASE7_CANARY_SIMULATION_ENABLED: "false"
      V2_PHASE7_CIRCUIT_BREAKER_ENABLED: "false"
      V2_PHASE7_ALLOW_ADMIN_DUAL_ROLE: "false"
      V2_PHASE7_ROLLOUT_SALT: ${V2_PHASE7_ROLLOUT_SALT:-2026-07-25.1}
    volumes:
      - bmv-persistent-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')",
        ]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s

volumes:
  bmv-persistent-data:
    name: bmv-persistent-data
