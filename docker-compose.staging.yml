# Dedicated staging stack — separate DB/volumes from local and production.
#
# Setup:
#   cp .env.staging.example .env.staging
#   # edit secrets and DOMAIN
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#   ./scripts/verify-staging.sh https://api-host https://web-host
#
# Rollback application code (keep migration history):
#   git checkout <previous-sha>
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
# Do NOT run destructive Phase 7 / commercial downgrades when history exists.

name: bmv-staging

services:
  db:
    image: postgres:16-alpine
    container_name: bmv-staging-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildmyversion_staging}
      POSTGRES_USER: ${POSTGRES_USER:-bmv_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}
    volumes:
      - bmv-staging-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bmv_staging} -d ${POSTGRES_DB:-buildmyversion_staging}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bmv-staging-api
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER:-bmv_staging}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-buildmyversion_staging}
      UPLOAD_DIR: /app/data/uploads
      PREVIEW_APPS_DIR: /app/data/preview-apps
      PREVIEW_CANDIDATES_DIR: /app/data/preview-candidates
      PREVIEW_VALIDATIONS_DIR: /app/data/runtime-validation
      PREVIEW_TEMPLATE_DIR: /app/backend/preview-template
      DATA_DIR: /app/data
      INTERNAL_BASE_URL: http://127.0.0.1:8000
      SEED_DEMO: "false"
      PREVIEW_GENERATOR_V2: ${PREVIEW_GENERATOR_V2:-true}
      V2_RUNTIME_VALIDATION_ENABLED: ${V2_RUNTIME_VALIDATION_ENABLED:-true}
      V2_VISUAL_EVALUATION_ENABLED: ${V2_VISUAL_EVALUATION_ENABLED:-false}
      V2_TIER2_GENERATION_ENABLED: "true"
      V2_TIER3_GENERATION_ENABLED: "false"
      V2_PHASE7_ROLLOUT_PERCENT: "0"
      V2_PHASE7_PERCENT_SERVE_ENABLED: "false"
      V2_PHASE7_LIVE_CANARY_ENABLED: "false"
      V2_PHASE7_LIVE_CANARY_PROVIDERS_ENABLED: "false"
      V2_PHASE7_AUTO_ROLLBACK_ENABLED: "false"
      V2_PHASE7_PROMOTE_ENABLED: "false"
      V2_PHASE7_SHADOW_LIVE_PROVIDERS_ENABLED: "false"
      V2_PHASE7_CANARY_SIMULATION_ENABLED: "false"
      V2_PHASE7_ROLLOUT_ENABLED: ${V2_PHASE7_ROLLOUT_ENABLED:-true}
      V2_PHASE7_OPS_DASHBOARD_ENABLED: ${V2_PHASE7_OPS_DASHBOARD_ENABLED:-true}
      V2_PHASE7_OPS_ALERTS_ENABLED: ${V2_PHASE7_OPS_ALERTS_ENABLED:-true}
    volumes:
      - bmv-staging-api-data:/app/data
    ports:
      - "${STAGING_API_PORT:-8002}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')",
        ]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8002}
        VITE_ROY_WHATSAPP_NUMBER: ${ROY_WHATSAPP_NUMBER:-}
    container_name: bmv-staging-web
    ports:
      - "${STAGING_WEB_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bmv-staging-pg-data:
  bmv-staging-api-data:
