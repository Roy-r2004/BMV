name: preview-template-tests

# Roadmap 1.10. The standing rule is that no test may leave pytest until this
# job is green on `main`, so it runs on every push and PR rather than behind a
# `paths:` filter — a filtered job reports "skipped", not "green", and cannot
# serve as a required check.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/preview-template-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/preview-template-tests/package-lock.json
            backend/preview-template/package-lock.json

      # The tests import the template's source across a directory boundary, so
      # its bare imports (`react`, and whatever a future test's component pulls
      # in) resolve from `preview-template/node_modules` — not from this
      # package's. Without this step both `tsc -b` and vite fail to resolve
      # `react` on a clean checkout, which is invisible on any machine that has
      # already run the template's install.
      - name: Install the template's dependencies (for module resolution)
        working-directory: backend/preview-template
        run: npm ci --no-audit --no-fund

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
