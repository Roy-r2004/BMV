services:
  - type: web
    name: bmv-api
    runtime: python
    # Keep backend rootDir; preview-template is vendored at backend/preview-template
    rootDir: backend
    plan: free
    buildCommand: |
      set -e
      pip install -r requirements.txt
      # Node/npm required for Vite preview-app builds at runtime
      NODE_DIR="$HOME/node"
      if [ ! -x "$NODE_DIR/bin/node" ]; then
        curl -fsSL https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.xz -o /tmp/node.tar.xz
        mkdir -p "$NODE_DIR"
        tar -xJf /tmp/node.tar.xz -C "$NODE_DIR" --strip-components=1
      fi
      "$NODE_DIR/bin/node" -v
      "$NODE_DIR/bin/npm" -v
      test -f preview-template/package.json
      echo "preview-template OK"
      # Chromium only — do NOT use --with-deps on Render (needs root `su` and fails)
      playwright install chromium
    startCommand: export PATH="$HOME/node/bin:$PATH" && export INTERNAL_BASE_URL="http://127.0.0.1:${PORT}" && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      # Ephemeral SQLite is fine for free tier (wiped on redeploy; PlateSync re-seeds)
      - key: DATABASE_URL
        value: sqlite:///./buildmyversion.db
      - key: UPLOAD_DIR
        value: ./app/uploads
      - key: PREVIEW_TEMPLATE_DIR
        value: ./preview-template
      - key: AI_PROVIDER
        value: openrouter
      # Fast live path — Flash for speed; visual critique stays on
      - key: TEXT_MODEL
        value: google/gemini-2.5-flash
      - key: PREVIEW_APP_MODEL
        value: google/gemini-2.5-flash
      - key: ARCHITECT_MODEL
        value: google/gemini-2.5-flash
      - key: CRITIC_MODEL
        value: google/gemini-2.5-flash
      - key: FIX_MODEL
        value: google/gemini-2.5-flash
      - key: PREVIEW_SKIP_CRITIC
        value: "true"
      - key: PREVIEW_SKIP_VISUAL_CRITIC
        value: "false"
      - key: PREVIEW_MAX_BUILD_FIX_ATTEMPTS
        value: "2"
      - key: PREVIEW_MAX_FIX_LOOP_SECONDS
        value: "300"
      # Network-bound OpenRouter calls — 4 is safer than 8 (hangs/rate-limits)
      - key: PREVIEW_PARALLEL_WORKERS
        value: "4"
      - key: CORS_ORIGINS
        value: https://bmv-web.onrender.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ROY_WHATSAPP_NUMBER
        sync: false

  - type: web
    name: bmv-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bmv-api.onrender.com
      - key: VITE_ROY_WHATSAPP_NUMBER
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
