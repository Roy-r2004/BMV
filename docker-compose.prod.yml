# Production stack:
#   App (always) + optional Traefik edge + optional Ollama
#
# Coolify:
#   Coolify already owns :80/:443. Deploy with this file as-is (Traefik is
#   profile-gated and will NOT start). Prefer docker-compose.coolify.yml when
#   configuring a new Coolify resource.
#
# Bare VPS / Hostinger with bundled Traefik:
#   cp .env.prod.example .env
#   # edit DOMAIN, ACME_EMAIL, ADMIN_PASSWORD, OPENROUTER_API_KEY
#   docker compose -f docker-compose.prod.yml --profile traefik up -d --build
#
# Optional Ollama:
#   docker compose -f docker-compose.prod.yml --profile ollama --profile init run --rm ollama-init
#   docker compose -f docker-compose.prod.yml --profile traefik --profile ollama up -d --build

name: buildmyversion-prod

services:
  # Profile-gated: Coolify proxy already binds host :80/:443.
  traefik:
    profiles: ["traefik"]
    image: traefik:v3.3
    container_name: bmv-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - bmv-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:-admin:$$apr1$$H6uskkkW$$IgXLP6ewTrSuBkTrqE8wj/}"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
    mem_limit: 256m
    cpus: "0.50"

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: bmv-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - bmv-internal
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 6g
    cpus: "4"
    # NVIDIA GPU (uncomment on GPU hosts):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama-init:
    profiles: ["ollama", "init"]
    image: ollama/ollama:latest
    container_name: bmv-ollama-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      PULL_MODELS: ${PULL_MODELS:-true}
      TEXT_MODEL: ${TEXT_MODEL:-llama3.1:8b}
      VISION_MODEL: ${VISION_MODEL:-llama3.2-vision}
      CODER_MODEL: ${CODER_MODEL:-qwen2.5-coder:7b}
    volumes:
      - ./docker/ollama-init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - bmv-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        VITE_API_BASE_URL: ""
        VITE_ROY_WHATSAPP_NUMBER: ${ROY_WHATSAPP_NUMBER:-}
    container_name: bmv-app
    restart: unless-stopped
    # Coolify / compose proxy reach this container port (no host :80 bind).
    expose:
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-roy.rizkallah@hotmail.com}
      ADMIN_NAME: ${ADMIN_NAME:-Roy}
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-}
      ADMIN_SYNC_PASSWORD: ${ADMIN_SYNC_PASSWORD:-true}
      ADMIN_ALERT_WEBHOOK_URL: ${ADMIN_ALERT_WEBHOOK_URL:-}
      ROY_WHATSAPP_NUMBER: ${ROY_WHATSAPP_NUMBER:-}
      # Never re-seed PlateSync — customer builds must persist across redeploys
      SEED_DEMO: "false"
      DATABASE_URL: sqlite:////app/data/buildmyversion.db
      UPLOAD_DIR: /app/data/uploads
      STATIC_DIR: /app/static
      PREVIEW_TEMPLATE_DIR: /app/backend/preview-template
      PREVIEW_APPS_DIR: /app/data/preview-apps
      PREVIEW_CANDIDATES_DIR: /app/data/preview-candidates
      PREVIEW_VALIDATIONS_DIR: /app/data/runtime-validation
      DATA_DIR: /app/data
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      INTERNAL_BASE_URL: http://127.0.0.1:8000
      # Hostinger default: OpenRouter (set OPENROUTER_API_KEY in .env)
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Build My Version}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://${DOMAIN}}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      TEXT_MODEL: ${TEXT_MODEL:-google/gemini-2.5-flash}
      PREVIEW_APP_MODEL: ${PREVIEW_APP_MODEL:-deepseek/deepseek-chat}
      ARCHITECT_MODEL: ${ARCHITECT_MODEL:-google/gemini-2.5-flash}
      CRITIC_MODEL: ${CRITIC_MODEL:-google/gemini-2.5-flash}
      FIX_MODEL: ${FIX_MODEL:-google/gemini-2.5-flash}
      VISION_MODEL: ${VISION_MODEL:-meta-llama/llama-3.2-11b-vision-instruct}
      OLLAMA_URL: http://ollama:11434
      PULL_MODELS: "false"
      APPSPEC_MODE: ${APPSPEC_MODE:-on}
      APPSPEC_SCHEMA_VERSION: ${APPSPEC_SCHEMA_VERSION:-1.0}
      APPSPEC_PROMPT_REVISION: ${APPSPEC_PROMPT_REVISION:-2026-07-15.1}
      APPSPEC_MODEL: ${APPSPEC_MODEL:-google/gemini-2.5-flash}
      APPSPEC_REPAIR_MODEL: ${APPSPEC_REPAIR_MODEL:-google/gemini-2.5-flash}
      APPSPEC_COVERAGE_MODEL: ${APPSPEC_COVERAGE_MODEL:-deepseek/deepseek-chat}
      APPSPEC_V2_COVERAGE_MODEL: ${APPSPEC_V2_COVERAGE_MODEL:-deepseek/deepseek-chat}
      APPSPEC_MAX_CALLS: ${APPSPEC_MAX_CALLS:-6}
      APPSPEC_MAX_REPAIR_ATTEMPTS: ${APPSPEC_MAX_REPAIR_ATTEMPTS:-3}
      APPSPEC_MAX_DETERMINISTIC_HEALS: ${APPSPEC_MAX_DETERMINISTIC_HEALS:-4}
      APPSPEC_FALLBACK_ENABLED: ${APPSPEC_FALLBACK_ENABLED:-false}
      APPSPEC_MAX_TOKENS: ${APPSPEC_MAX_TOKENS:-24000}
      APPSPEC_REPAIR_MAX_TOKENS: ${APPSPEC_REPAIR_MAX_TOKENS:-24000}
      APPSPEC_COVERAGE_MAX_TOKENS: ${APPSPEC_COVERAGE_MAX_TOKENS:-6000}
      APPSPEC_MIN_COVERAGE_SCORE: ${APPSPEC_MIN_COVERAGE_SCORE:-95}
      APPSPEC_PREVIEW_TARGET_PAGES: ${APPSPEC_PREVIEW_TARGET_PAGES:-6}
      APPSPEC_PREVIEW_MAX_PAGES: ${APPSPEC_PREVIEW_MAX_PAGES:-8}
      PREVIEW_SKIP_CRITIC: ${PREVIEW_SKIP_CRITIC:-false}
      PREVIEW_SKIP_VISUAL_CRITIC: ${PREVIEW_SKIP_VISUAL_CRITIC:-false}
      PREVIEW_PARALLEL_WORKERS: ${PREVIEW_PARALLEL_WORKERS:-2}
      PREVIEW_QUALITY_AI_REPAIR: ${PREVIEW_QUALITY_AI_REPAIR:-true}
      PREVIEW_MAX_QUALITY_FIX_ATTEMPTS: ${PREVIEW_MAX_QUALITY_FIX_ATTEMPTS:-2}
      QUALITY_FIX_MODEL: ${QUALITY_FIX_MODEL:-z-ai/glm-5.2}
      # Preview Generator v2 + Expanded Preview (Tier 2 admin-gated only)
      PREVIEW_GENERATOR_V2: ${PREVIEW_GENERATOR_V2:-true}
      V2_RUNTIME_VALIDATION_ENABLED: ${V2_RUNTIME_VALIDATION_ENABLED:-true}
      V2_VISUAL_EVALUATION_ENABLED: ${V2_VISUAL_EVALUATION_ENABLED:-true}
      V2_TIER2_GENERATION_ENABLED: ${V2_TIER2_GENERATION_ENABLED:-true}
      V2_TIER3_GENERATION_ENABLED: "false"
      # Phase 7 hard gates
      V2_PHASE7_ROLLOUT_ENABLED: ${V2_PHASE7_ROLLOUT_ENABLED:-true}
      V2_PHASE7_OPS_DASHBOARD_ENABLED: ${V2_PHASE7_OPS_DASHBOARD_ENABLED:-true}
      V2_PHASE7_OPS_ALERTS_ENABLED: ${V2_PHASE7_OPS_ALERTS_ENABLED:-true}
      V2_PHASE7_SHADOW_ENABLED: "false"
      V2_PHASE7_PROMOTE_ENABLED: "false"
      V2_PHASE7_ROLLOUT_PERCENT: "0"
      V2_PHASE7_PERCENT_SERVE_ENABLED: "false"
      V2_PHASE7_LIVE_CANARY_ENABLED: "false"
      V2_PHASE7_LIVE_CANARY_PROVIDERS_ENABLED: "false"
      V2_PHASE7_AUTO_ROLLBACK_ENABLED: "false"
      V2_PHASE7_SHADOW_LIVE_PROVIDERS_ENABLED: "false"
      V2_PHASE7_CANARY_SIMULATION_ENABLED: "false"
      V2_PHASE7_CIRCUIT_BREAKER_ENABLED: "false"
      V2_PHASE7_ALLOW_ADMIN_DUAL_ROLE: "false"
      V2_PHASE7_ROLLOUT_SALT: ${V2_PHASE7_ROLLOUT_SALT:-2026-07-25.1}
    volumes:
      - buildmyversion-data:/app/data
    networks:
      - bmv-public
      - bmv-internal
    labels:
      # Used only when Traefik profile is enabled on a bare VPS.
      - "traefik.enable=true"
      - "traefik.http.routers.bmv.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.bmv.entrypoints=websecure"
      - "traefik.http.routers.bmv.tls.certresolver=letsencrypt"
      - "traefik.http.services.bmv.loadbalancer.server.port=8000"
    # Preview builds (Node + Playwright) need headroom — use a 4GB+ VPS.
    mem_limit: 3g
    cpus: "2.00"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')",
        ]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s

networks:
  bmv-public:
    name: bmv-public
  bmv-internal:
    name: bmv-internal
    internal: true

volumes:
  buildmyversion-data:
  ollama-models:
  traefik-certs:
